[package]
name = "ring_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Composed ring over an SPSC, MPSC, or crossbeam backend behind one surface"
publish = true

[features]
default = []
# Feature 187: an optional third backend, so consumers needing a working
# multi-producer channel are not blocked on the in-house ring being finished.
crossbeam = [ "dep:crossbeam-queue" ]

[dependencies]
ring_config = { workspace = true }
ring_mpsc = { workspace = true }
ring_overflow = { workspace = true }
ring_slot = { workspace = true }
ring_spsc = { workspace = true }
ring_types = { workspace = true }
crossbeam-queue = { workspace = true, optional = true }

[lints]
workspace = true
