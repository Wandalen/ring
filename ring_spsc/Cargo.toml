[package]
name = "ring_spsc"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Single-producer single-consumer ring API"
publish = true

[dependencies]
ring_store = { workspace = true }
ring_config = { workspace = true }
ring_cursor = { workspace = true }
ring_slot = { workspace = true }
ring_types = { workspace = true }

# For `tests/spsc_test.rs`'s `exhaustive` module. Only under
# `RUSTFLAGS="--cfg loom"`; an ordinary build never sees it and never pays for
# it. It works because `ring_atomic` swaps `AtomicSeq` for an instrumented one
# under the same cfg, so loom explores this crate's own code, not a
# re-implementation of it.
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[lints]
workspace = true
