[package]
name = "ring_handle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Shareable producer and consumer ends"
publish = true

[features]
default = []
# Feature 187's third backend, forwarded rather than re-declared. Present so
# `docs/integration/001`'s requirement 1 — the same handle behaviour across
# every backend — can be tested against all three rather than the two that
# need no feature.
crossbeam = ["ring_core/crossbeam"]

[dependencies]
ring_core = { path = "../ring_core", version = "0.1.0" }

[dev-dependencies]
ring_config = { path = "../ring_config" }
ring_types = { path = "../ring_types" }
trybuild = "1.0"

[lints]
workspace = true
