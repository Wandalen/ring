[package]
name = "ring_spsc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Single-producer single-consumer ring API"
publish = true

[dependencies]
ring_config = { path = "../ring_config", version = "0.1.0" }
ring_cursor = { path = "../ring_cursor", version = "0.1.0" }
ring_slot = { path = "../ring_slot", version = "0.1.0" }
ring_store = { path = "../ring_store", version = "0.1.0" }
ring_types = { path = "../ring_types", version = "0.1.0" }

# `tests/spsc_test.rs`'s `exhaustive` module. Only under
# `RUSTFLAGS="--cfg loom"`; an ordinary build never sees it and never pays for
# it. The seam that makes it work is `ring_atomic`'s — it swaps `AtomicSeq` for
# an instrumented one under the same cfg, so this crate's own code is what gets
# explored rather than a re-implementation of it.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
