[package]
name = "ring_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Composed ring over an SPSC, MPSC, or crossbeam backend behind one surface"
publish = true

[features]
default = []
# Feature 187: an optional third backend, so consumers needing a working
# multi-producer channel are not blocked on the in-house ring being finished.
crossbeam = ["dep:crossbeam-queue"]

[dependencies]
crossbeam-queue = { version = "0.3", optional = true, default-features = false, features = [
    "alloc",
] }
ring_config = { path = "../ring_config", version = "0.1.0" }
ring_mpsc = { path = "../ring_mpsc", version = "0.1.0" }
ring_overflow = { path = "../ring_overflow", version = "0.1.0" }
ring_slot = { path = "../ring_slot", version = "0.1.0" }
ring_spsc = { path = "../ring_spsc", version = "0.1.0" }
ring_types = { path = "../ring_types", version = "0.1.0" }

[lints]
workspace = true
