[package]
name = "ring_handle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Shareable producer and consumer ends"
publish = true

[features]
default = []
# `ring_core`'s crossbeam backend, forwarded rather than re-declared, so the
# handles can be tested for the same behaviour on every backend.
crossbeam = [ "ring_core/crossbeam" ]

[dependencies]
ring_core = { workspace = true }

[dev-dependencies]
ring_config = { workspace = true }
ring_types = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
