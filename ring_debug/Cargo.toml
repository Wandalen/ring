[package]
name = "ring_debug"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Runtime invariant checks over a live ring"
publish = false

[dependencies]
ring_core = { workspace = true }
ring_cursor = { workspace = true }
# Beyond the two edges the initial design assigned this crate. Both are forced
# rather than convenient. See docs/integration/001.
#   ring_types:  `Seq` and `Capacity` appear in every public signature here.
#   ring_atomic: `PaddedCursor`'s `load`/`store` are `SeqCell` trait methods,
#                so reading a cursor at all needs the trait in scope. This crate
#                exists because the derived values are no substitute for reading
#                the cursors (docs/pitfall/001).
ring_types = { workspace = true }
ring_atomic = { workspace = true }

[dev-dependencies]
# `check_ends` takes a split ring's two ends, and building one needs a config.
ring_config = { workspace = true }

[lints]
workspace = true
