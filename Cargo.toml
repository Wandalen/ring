[workspace]
resolver = "3"

members = [
    # Family-neutral validation machinery: it depends on no ring_* crate, so its
    # stage gates run against an empty workspace. ring_bench (tier 12) grades
    # write paths; this grades the family. Also grades other families in the
    # tree (see gate/declared/) — a shared-infrastructure crate that lives here
    # rather than at the repository root, kept alongside the family it was
    # built to grade first.
    "bench_harness",

    # The 33-crate ring_* forest, in dependency order: every crate's
    # dependencies appear above it, so the forest is acyclic by inspection.
    # ring_mpsc and ring_tls were mpsc_ring and bump_log before the family
    # adopted one prefix.
    "ring_types",
    "ring_seqno",
    "ring_index",
    "ring_align",
    "ring_atomic",
    "ring_config",
    "ring_slot",
    "ring_cursor",
    "ring_store",
    "ring_wait",
    "ring_gating",
    "ring_barrier",
    "ring_claim",
    "ring_publish",
    "ring_consume",
    "ring_overflow",
    "ring_batch",
    "ring_event",
    "ring_spsc",
    "ring_mpsc",
    "ring_core",
    "ring_handle",
    "ring_tls",
    "ring_flush",
    "ring_stats",
    "ring_shutdown",
    "ring_poll",
    "ring_registry",
    "ring_factory",
    "ring_trace",
    "ring_debug",
    "ring_testkit",
    "ring_bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Wandalen/ring"

# Members inherit with `name = { workspace = true }`. Family crates carry `path` for the
# workspace and `version` for `cargo publish`, which keeps only the version; a minor bump
# (0.1 -> 0.2) updates both `[workspace.package] version` and these. `publish = false`
# crates are left out so a published crate cannot depend on them.
[workspace.dependencies]
ring_align = { path = "ring_align", version = "0.1.0" }
ring_atomic = { path = "ring_atomic", version = "0.1.0" }
ring_barrier = { path = "ring_barrier", version = "0.1.0" }
ring_batch = { path = "ring_batch", version = "0.1.0" }
ring_claim = { path = "ring_claim", version = "0.1.0" }
ring_config = { path = "ring_config", version = "0.1.0" }
ring_consume = { path = "ring_consume", version = "0.1.0" }
ring_core = { path = "ring_core", version = "0.1.0" }
ring_cursor = { path = "ring_cursor", version = "0.1.0" }
ring_event = { path = "ring_event", version = "0.1.0" }
ring_factory = { path = "ring_factory", version = "0.1.0" }
ring_flush = { path = "ring_flush", version = "0.1.0" }
ring_gating = { path = "ring_gating", version = "0.1.0" }
ring_handle = { path = "ring_handle", version = "0.1.0" }
ring_index = { path = "ring_index", version = "0.1.0" }
ring_mpsc = { path = "ring_mpsc", version = "0.1.0" }
ring_overflow = { path = "ring_overflow", version = "0.1.0" }
ring_poll = { path = "ring_poll", version = "0.1.0" }
ring_publish = { path = "ring_publish", version = "0.1.0" }
ring_registry = { path = "ring_registry", version = "0.1.0" }
ring_seqno = { path = "ring_seqno", version = "0.1.0" }
ring_shutdown = { path = "ring_shutdown", version = "0.1.0" }
ring_slot = { path = "ring_slot", version = "0.1.0" }
ring_spsc = { path = "ring_spsc", version = "0.1.0" }
ring_stats = { path = "ring_stats", version = "0.1.0" }
ring_store = { path = "ring_store", version = "0.1.0" }
ring_tls = { path = "ring_tls", version = "0.1.0" }
ring_types = { path = "ring_types", version = "0.1.0" }
ring_wait = { path = "ring_wait", version = "0.1.0" }

crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
loom = "0.7"
trybuild = "1.0"

# Every lint below the originals was clean over `--all-targets --all-features`
# when added (2026-09-30), so the table only stops regressions. A lint that
# fires on existing code goes in with its fix, never as a workspace `allow`.
# `verb/lint` and G9 run with `-D warnings`: `warn` here fails the gate.

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe-code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
# `loom` is set by RUSTFLAGS, not by any feature, so rustc has no other way to
# learn it is a real cfg. Declared once here rather than per crate: the lints
# table is inherited workspace-wide, and a crate cannot both inherit it and add
# its own. Only ring_atomic, ring_cursor and ring_publish read the cfg — see
# ring_atomic's module documentation on the seam.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# Unsafe: one operation per block, each with its own `// SAFETY:`.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
mem_forget = "warn"
# Concurrency: locks are what this family exists to avoid; refcount bumps stay visible.
mutex_atomic = "warn"
mutex_integer = "warn"
rc_mutex = "warn"
clone_on_ref_ptr = "warn"
# Determinism: hash iteration order would leak into the delivery order.
iter_over_hash_type = "warn"
# Sequence and index arithmetic.
cast_sign_loss = "warn"
precedence_bits = "warn"
# Hygiene.
dbg_macro = "warn"
exit = "warn"
infinite_loop = "warn"
large_stack_frames = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "warn"
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"
