[package]
name = "ring_publish"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Publication of claimed slots to consumers"
publish = true

[dependencies]
ring_types = { path = "../ring_types", version = "0.1.0" }
ring_cursor = { path = "../ring_cursor", version = "0.1.0" }

# Tests only. `tests/handshake_test.rs` is feature 170's reached-test, which is
# the whole four-operation handshake — so it needs the other three operations'
# crates. None of them depends on this one, so the graph stays acyclic.
[dev-dependencies]
ring_claim = { path = "../ring_claim", version = "0.1.0" }
ring_consume = { path = "../ring_consume", version = "0.1.0" }
ring_barrier = { path = "../ring_barrier", version = "0.1.0" }
ring_gating = { path = "../ring_gating", version = "0.1.0" }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
