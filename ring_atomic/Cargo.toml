[package]
name = "ring_atomic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Atomic sequence helpers with explicit memory orderings"
publish = true

[dependencies]
ring_types = { path = "../ring_types", version = "0.1.0" }

# Only under `RUSTFLAGS="--cfg loom"`. An ordinary build never sees it, never
# resolves it, and never compiles it — see the module documentation on the seam.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true
