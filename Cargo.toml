[workspace]
resolver = "3"

members = [
  # Family-neutral validation machinery. It depends on no ring_* crate, so its
  # stage gates run against an empty workspace. ring_bench (tier 12) grades
  # write paths; this grades the family. It also grades other families in the
  # tree (see gate/declared/). It is shared infrastructure, but it lives here
  # rather than at the repository root, next to the family it was built to
  # grade first.
  "bench_harness",

  # The 33-crate ring_* forest, in dependency order: every crate's
  # dependencies appear above it, so the forest is acyclic by inspection.
  # ring_mpsc and ring_tls were mpsc_ring and bump_log before the family
  # adopted one prefix.
  "ring_types",
  "ring_seqno",
  "ring_index",
  "ring_align",
  "ring_atomic",
  "ring_config",
  "ring_slot",
  "ring_cursor",
  "ring_store",
  "ring_wait",
  "ring_gating",
  "ring_barrier",
  "ring_claim",
  "ring_publish",
  "ring_consume",
  "ring_overflow",
  "ring_batch",
  "ring_event",
  "ring_spsc",
  "ring_mpsc",
  "ring_core",
  "ring_handle",
  "ring_tls",
  "ring_flush",
  "ring_stats",
  "ring_shutdown",
  "ring_poll",
  "ring_registry",
  "ring_factory",
  "ring_trace",
  "ring_debug",
  "ring_testkit",
  "ring_bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Wandalen/ring"

# Members inherit with `name = { workspace = true }`. Family crates carry `path` for the
# workspace and `version` for `cargo publish`, which keeps only the version; a minor bump
# (0.1 -> 0.2) updates both `[workspace.package] version` and these. `publish = false`
# crates are left out so a published crate cannot depend on them.
[workspace.dependencies]
ring_align = { path = "ring_align", version = "0.1.0" }
ring_atomic = { path = "ring_atomic", version = "0.1.0" }
ring_barrier = { path = "ring_barrier", version = "0.1.0" }
ring_batch = { path = "ring_batch", version = "0.1.0" }
ring_claim = { path = "ring_claim", version = "0.1.0" }
ring_config = { path = "ring_config", version = "0.1.0" }
ring_consume = { path = "ring_consume", version = "0.1.0" }
ring_core = { path = "ring_core", version = "0.1.0" }
ring_cursor = { path = "ring_cursor", version = "0.1.0" }
ring_event = { path = "ring_event", version = "0.1.0" }
ring_factory = { path = "ring_factory", version = "0.1.0" }
ring_flush = { path = "ring_flush", version = "0.1.0" }
ring_gating = { path = "ring_gating", version = "0.1.0" }
ring_handle = { path = "ring_handle", version = "0.1.0" }
ring_index = { path = "ring_index", version = "0.1.0" }
ring_mpsc = { path = "ring_mpsc", version = "0.1.0" }
ring_overflow = { path = "ring_overflow", version = "0.1.0" }
ring_poll = { path = "ring_poll", version = "0.1.0" }
ring_publish = { path = "ring_publish", version = "0.1.0" }
ring_registry = { path = "ring_registry", version = "0.1.0" }
ring_seqno = { path = "ring_seqno", version = "0.1.0" }
ring_shutdown = { path = "ring_shutdown", version = "0.1.0" }
ring_slot = { path = "ring_slot", version = "0.1.0" }
ring_spsc = { path = "ring_spsc", version = "0.1.0" }
ring_stats = { path = "ring_stats", version = "0.1.0" }
ring_store = { path = "ring_store", version = "0.1.0" }
ring_tls = { path = "ring_tls", version = "0.1.0" }
ring_types = { path = "ring_types", version = "0.1.0" }
ring_wait = { path = "ring_wait", version = "0.1.0" }

crossbeam-queue = { version = "0.3", default-features = false, features = [ "alloc" ] }
loom = "0.7"
trybuild = "1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe-code = "deny"
# RUSTFLAGS sets `loom`, not any feature, so rustc has no other way to learn
# it is a real cfg. It is declared once here, not per crate, because the lints
# table is inherited workspace-wide and a crate cannot both inherit it and add
# its own. Only ring_atomic, ring_cursor and ring_publish read the cfg. See
# ring_atomic's module documentation on the `loom` switch.
unexpected_cfgs = { level = "warn", check-cfg = [ 'cfg(loom)' ] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
