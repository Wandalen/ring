[package]
name = "ring_testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Determinism-test fixtures driving scripted claim and drain sequences"
publish = false

[dependencies]
ring_core = { workspace = true }
ring_tls = { workspace = true }
ring_shutdown = { workspace = true }

# `ring_config` is not one of message 960's declared edges. It is a
# dev-dependency rather than an added one, because `Script::run` takes a ring the
# caller already built, so the config type appears in no signature here. Only the
# tests and doc examples need to build a ring to drive.
[dev-dependencies]
ring_config = { workspace = true }
# `RingConfig::with_overflow` takes an `OverflowPolicy`, which `ring_config`
# does not re-export. So a test that varies the policy has to name the crate
# the vocabulary lives in.
ring_types = { workspace = true }

# The exhaustive half of feature 188. Only under `RUSTFLAGS="--cfg loom"`. An
# ordinary build never sees it. The model lives in `tests/`, not `src/`, so the
# scripted fixture stays measurable by a coverage run that does not set the cfg.
# That placement has a cost. The same cfg-less run does not compile the
# exhaustive file at all, so a break there still leaves `verb/test` fully green
# (docs/workaround/002 TK54).
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[lints]
workspace = true
