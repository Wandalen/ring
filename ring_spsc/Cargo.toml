[package]
name = "ring_spsc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Single-producer single-consumer ring API"
publish = true

[dependencies]
ring_store = { workspace = true }
ring_config = { workspace = true }
ring_cursor = { workspace = true }
ring_slot = { workspace = true }
ring_types = { workspace = true }

# `tests/spsc_test.rs`'s `exhaustive` module. Only under
# `RUSTFLAGS="--cfg loom"`; an ordinary build never sees it and never pays for
# it. The seam that makes it work is `ring_atomic`'s — it swaps `AtomicSeq` for
# an instrumented one under the same cfg, so this crate's own code is what gets
# explored rather than a re-implementation of it.
[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[lints]
workspace = true
