# Full family gate suite. Slow, but an honest signal.
#
# Runs `bench_harness/gate/run_all.sh --family ring`, every gate listed in
# `bench_harness/gate/declared/ring/gates.txt`, exactly as `verb/gate` does locally. Failures go red. The workflow never runs on
# PRs, so a failure blocks nothing, but the Gates badge must mean something.
# Fast per-push verification lives in `ci.yml`.
#
# Schedule: `master` pushes + nightly + manual dispatch. Never on every PR,
# because g1 (tarpaulin) is slow and g12 rewrites files under `src/` while it
# runs, so it must not overlap any concurrent build of the same tree.

name: Gates

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gates:
    name: run_all.sh --family ring
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          # trybuild's pinned .stderr files quote sysroot sources, and rustc
          # omits the snippet when the source is unreadable. Without rust-src
          # the ring_handle compile-fail suite mismatches here while passing
          # under ci.yml, which installs this component.
          components: rust-src
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-tarpaulin
      - uses: Swatinem/rust-cache@v2
      - name: full gate suite (verb/gate)
        run: bash bench_harness/gate/run_all.sh --family ring
