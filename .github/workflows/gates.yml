# Full family gate suite. Slow, but an honest signal.
#
# Runs `just gate`, the same recipe a local run uses: every gate listed in
# `bench_harness/gate/declared/ring/gates.txt`. Failures go red. The workflow
# never runs on PRs, so a failure blocks nothing, but the Gates badge must mean
# something.
# Fast per-push verification lives in `ci.yml`.
#
# Schedule: `master` pushes + nightly + manual dispatch. Never on every PR,
# because g1 (tarpaulin) is slow and g12 rewrites files under `src/` while it
# runs, so it must not overlap any concurrent build of the same tree.

name: Gates

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.58.0

jobs:
  gates:
    name: run_all.sh --family ring
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-tarpaulin
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: full gate suite
        run: just gate
