# Fast verification on master pushes and PRs.
#
# Runs the justfile's recipes, so CI and a local run share one copy of each
# command: `just test`'s steps (nextest, doctests, clippy), `just doc`, and
# `just fmt --check` under the nightly the justfile pins.
# Slow jobs (full gate suite, loom) live in `gates.yml` / `loom.yml` and run
# on `master` + nightly instead of blocking every push.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  JUST_VERSION: 1.58.0

jobs:
  test:
    name: nextest + doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: nextest
        run: just nextest
      - name: doctests
        run: just doctest

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: just lint

  doc:
    name: cargo doc --no-deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc, warnings denied
        run: just doc

  fmt:
    name: nightly rustfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: read the nightly pin from the justfile
        id: pin
        run: |
          nightly="$(just --evaluate nightly)"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.nightly }}
          components: rustfmt
      - name: fmt check
        run: just fmt --check
