[package]
name = "ring_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Composed ring over an SPSC, MPSC, or crossbeam backend behind one surface"
publish = true

[features]
default = []
# An optional third backend, so consumers that need a working multi-producer
# channel are not blocked on the in-house ring. See
# docs/decisions/002_crossbeam_queue_is_an_interim_backend_inside_ring_core.md.
crossbeam = [ "dep:crossbeam-queue" ]

[dependencies]
ring_config = { workspace = true }
ring_mpsc = { workspace = true }
ring_overflow = { workspace = true }
ring_slot = { workspace = true }
ring_spsc = { workspace = true }
ring_types = { workspace = true }
crossbeam-queue = { workspace = true, optional = true }

[lints]
workspace = true
