[package]
name = "ring_bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
description = "Comparative write-path measurements — mutex, ring, and thread-local staging"
publish = false

[features]
# Forwards to `ring_factory`'s crossbeam door, which gates the off-the-shelf
# candidate. With this on, `Candidate::ALL` includes it.
crossbeam = [ "ring_factory/crossbeam" ]

[dependencies]
ring_factory = { workspace = true }
ring_tls = { workspace = true }
ring_flush = { workspace = true }
ring_stats = { workspace = true }
ring_spsc = { workspace = true }
ring_mpsc = { workspace = true }
# Each of these is needed to name a type in a signature.
#
#   ring_core:  `ring_flush::Flusher::new` takes a `ring_core::Producer`, and
#               `ring_flush` re-exports neither it nor a way to build one, so
#               the staging candidate cannot be constructed without this line.
#               It is a gap in the export Contract, not a preference.
#   ring_slot:  `ring_spsc::Ring< S >` and `ring_mpsc::Ring< S >` are generic
#               over `Slot`, so the two direct candidates cannot name their own
#               ring type without `TypedSlot`.
#   ring_types: `RingStats::record_drop` takes an `OverflowPolicy`, so the
#               per-run counters cannot be recorded without naming the policy
#               vocabulary.
ring_core = { workspace = true }
ring_slot = { workspace = true }
ring_types = { workspace = true }

[lints]
workspace = true
